name: Pályázatfigyelő – forrás-audit

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js telepítése
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit futtatása
        env:
          PF_REPO_URL: https://github.com/${{ github.repository }}
        run: node scripts/audit-sources.mjs

      - name: Eredmény commitolása
        run: |
          git config user.name "palyazatfigyelo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sources-audit.md
          git diff --cached --quiet || git commit -m "chore: forrás-audit frissítése"
          git diff --cached --quiet || git push
